<!doctype html><body style="margin:0;background:#2a1a24"><script type="module">
import * as THREE from '../three.module.min.js';import {createFighter,FIGHTER_IDS} from '../fighters.js';
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});R.setSize(1500,620);R.shadowMap.enabled=true;R.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(R.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(0x3a2830);s.add(new THREE.HemisphereLight(0xffe0b0,0x50301a,1.1));const d=new THREE.DirectionalLight(0xffc880,2.2);d.position.set(-6,10,8);d.castShadow=true;Object.assign(d.shadow.camera,{left:-10,right:10,top:6,bottom:-4});s.add(d);
const g=new THREE.Mesh(new THREE.BoxGeometry(18,.25,4),new THREE.MeshStandardMaterial({color:0xb58a5a}));g.position.y=-.125;g.receiveShadow=true;s.add(g);
const anims=new URLSearchParams(location.search).get('a')||'idle';
const cam=new THREE.OrthographicCamera(-7.5,7.5,3.1,-3.1,.1,100);cam.position.set(0,5,14);cam.lookAt(0,1.1,0);
const fs=FIGHTER_IDS.map((id,i)=>{const f=createFighter(id);f.group.position.x=-6+i*3;f.group.rotation.y=-.6;s.add(f.group);
 const a=anims.split(',');f.setAnim(a[i%a.length]);return f});
let n=0;function step(){for(const f of fs)f.update(1/60);n++}for(let i=0;i<(+new URLSearchParams(location.search).get('n')||30);i++)step();
R.render(s,cam);document.title='done';
</script>
