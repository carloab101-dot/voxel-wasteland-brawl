<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wasteland Brawl — Voxel Diorama Fighter</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#1b0f08;font-family:"DejaVu Sans Mono",Consolas,monospace}
canvas{display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;--a:#ff8a2a;--b:#3de8b0;--card:#f2e6cc;--ink:#2a1a10}
.t3{position:absolute;top:14px;left:50%;transform:translateX(-50%);text-align:center;font:900 28px "DejaVu Sans Mono",monospace;letter-spacing:6px;white-space:nowrap;text-shadow:3px 3px 0 #2a1a10,6px 6px 0 rgba(0,0,0,.25)}
.t3 small{display:block;font:600 11px "DejaVu Sans Mono",monospace;letter-spacing:2px;opacity:.85;margin-top:4px;text-shadow:1px 1px 0 #2a1a10}
.cd{position:absolute;top:78px;width:min(30vw,300px);min-height:100px;padding:10px 14px 10px 58px;box-sizing:border-box;background:var(--card);color:var(--ink);border:4px solid var(--ink);box-shadow:6px 6px 0 rgba(42,26,16,.85);transition:transform .08s}
.cd.l{left:18px}.cd.r{right:18px}.cd.hit{transform:translateX(3px) rotate(.8deg)}.cd.ko{filter:grayscale(.8) brightness(.8)}
.ix,.ix2{position:absolute;font:900 28px Georgia,serif;text-align:center;line-height:1;width:40px}.ix{left:10px;top:8px}.ix2{right:6px;bottom:6px;transform:rotate(180deg);font-size:16px}
.ix small,.ix2 small{display:block;font-size:.75em}.l .ix,.l .ix2{color:#b3401a}.r .ix,.r .ix2{color:#1a6a50}
.nm{font:800 15px "DejaVu Sans Mono",monospace;letter-spacing:.5px}.st{font:700 10px monospace;height:12px;letter-spacing:1.5px;opacity:.75;margin-top:2px}
.bar{position:relative;height:12px;margin-top:6px;margin-right:22px;background:#1a120c;border:2px solid var(--ink)}.bar i{position:absolute;left:0;top:0;bottom:0}
.bar .g{background:rgba(255,255,255,.85)}.l .bar .f{background:linear-gradient(90deg,var(--a),#ffd2a0)}.r .bar .f{background:linear-gradient(90deg,var(--b),#c8ffe8)}.bar .f.low{background:linear-gradient(90deg,#ff2244,#ff9a55)!important}
.hp{font:700 10px monospace;margin-top:4px;opacity:.85;line-height:1.4}.stars{float:right;letter-spacing:2px}
.co{position:absolute;top:196px;font:italic 900 20px "DejaVu Sans Mono",monospace;color:#fff;opacity:0;white-space:nowrap;text-shadow:2px 2px 0 #2a1a10,0 0 12px var(--a)}.co.l{left:22px}.co.r{right:22px;text-shadow:2px 2px 0 #2a1a10,0 0 12px var(--b)}
.dm{position:absolute;font:italic 900 28px "DejaVu Sans Mono",monospace;color:#fff;white-space:nowrap;text-shadow:2px 2px 0 #2a1a10,0 0 10px var(--a)}.dm.c{color:#ffd66b;font-size:38px}
.big{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font:900 min(108px,16vw) "DejaVu Sans Mono",monospace;letter-spacing:8px;color:#fff;text-shadow:6px 6px 0 #2a1a10,0 0 30px var(--a);display:none;white-space:nowrap}
.sub{position:absolute;left:50%;top:56%;transform:translateX(-50%);font:900 26px "DejaVu Sans Mono",monospace;color:#fff;text-shadow:3px 3px 0 #2a1a10;display:none;text-align:center;white-space:nowrap}.sub small{display:block;font:600 13px monospace;margin-top:8px}
.ft{position:absolute;bottom:12px;left:18px;right:150px;font:600 11px monospace;line-height:1.6;text-shadow:1px 1px 0 #000;opacity:.9}
.btn{position:fixed;z-index:20;cursor:pointer;color:#2a1a10;background:#f2e6cc;border:4px solid #2a1a10;box-shadow:5px 5px 0 #2a1a10;font:800 13px "DejaVu Sans Mono",monospace;letter-spacing:3px;padding:10px 18px;pointer-events:auto}
.btn:hover{background:#fff}.btn:active{transform:translate(2px,2px);box-shadow:3px 3px 0 #2a1a10}
#restart{bottom:14px;right:14px}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(27,15,8,.55);z-index:30}
#ov .box{background:#f2e6cc;color:#2a1a10;border:4px solid #2a1a10;box-shadow:8px 8px 0 #2a1a10;padding:18px 26px;text-align:center;max-width:94vw;max-height:94vh;overflow:auto}
#ov h1{margin:0;font:900 30px "DejaVu Sans Mono",monospace;letter-spacing:6px}
.sel{display:flex;gap:26px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.sel>div{border:4px solid #2a1a10;padding:10px 12px;min-width:250px;background:#fff8e8}
.ch{display:block;width:100%;margin:4px 0;font:700 13px monospace;background:#f2e6cc;color:#2a1a10;border:3px solid #2a1a10;padding:5px;cursor:pointer;text-align:left}
.ch.on{background:#2a1a10;color:#f2e6cc}.sel .d{font-size:11px;min-height:30px;margin-top:6px}
</style></head><body>
<div id="hud"></div>
<div id="restart" class="btn">RESTART</div>
<div id="ov"><div class="box">
<h1>☢ WASTELAND BRAWL ☢</h1><div style="font-size:12px;letter-spacing:2px;margin-top:4px">voxel diorama · local 2-player · first to 3 rounds</div>
<div class="sel"><div><b>PLAYER 1 · ♠</b> <small>(A / D)</small><div id="c1"></div><div class="d" id="d1"></div></div>
<div><b>PLAYER 2 · ♥</b> <small>(← / →)</small><div id="c2"></div><div class="d" id="d2"></div></div></div>
<div class="btn" id="go" style="position:static;display:inline-block">FIGHT! (ENTER)</div></div></div>
<script type="module" src="game.js"></script>
</body></html>
